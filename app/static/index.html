<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice RAG</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; transition: 0.2s; }
        #recordBtn { background-color: #e74c3c; color: white; }
        #recordBtn.recording { background-color: #c0392b; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .card { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .label { font-size: 12px; text-transform: uppercase; color: #6c757d; font-weight: bold; margin-bottom: 5px; }
        .content { font-size: 18px; margin-bottom: 0; }
        
        .metrics { display: flex; flex-wrap: wrap; gap: 15px; font-size: 14px; background: #e9ecef; padding: 15px; border-radius: 8px; font-family: monospace; }
        .metric-item { background: white; padding: 5px 10px; border-radius: 4px; border: 1px solid #ced4da; }
        
        #loading { text-align: center; display: none; font-style: italic; color: #666; margin: 20px 0; }
    </style>
</head>
<body>

    <h1>🎙️ Multilingual Voice RAG</h1>
    
    <div class="controls">
        <button id="recordBtn">Hold to Speak</button>
    </div>

    <div id="loading">Processing audio, retrieving context, and generating answer...</div>

    <div id="results" style="display: none;">
        <div class="card">
            <div class="label">Transcription (Translated to English)</div>
            <p class="content" id="transcriptionText"></p>
        </div>
        
        <div class="card" style="border-left: 5px solid #2ecc71;">
            <div class="label">Answer</div>
            <p class="content" id="answerText"></p>
        </div>
        
        <div class="label">Latency Breakdown</div>
        <div class="metrics" id="latencyMetrics"></div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        const recordBtn = document.getElementById('recordBtn');
        const loadingEl = document.getElementById('loading');
        const resultsEl = document.getElementById('results');
        const transcriptionText = document.getElementById('transcriptionText');
        const answerText = document.getElementById('answerText');
        const latencyMetrics = document.getElementById('latencyMetrics');

        // Request microphone access
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.addEventListener("dataavailable", event => {
                    audioChunks.push(event.data);
                });
                
                mediaRecorder.addEventListener("stop", () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    sendAudioToServer(audioBlob);
                });
            })
            .catch(err => {
                console.error("Microphone access denied: ", err);
                alert("Microphone access is required to use this app.");
            });

        // Hold to record logic
        recordBtn.addEventListener('mousedown', startRecording);
        recordBtn.addEventListener('touchstart', startRecording);
        
        recordBtn.addEventListener('mouseup', stopRecording);
        recordBtn.addEventListener('touchend', stopRecording);
        
        function startRecording(e) {
            e.preventDefault();
            if (mediaRecorder && mediaRecorder.state === "inactive") {
                mediaRecorder.start();
                recordBtn.classList.add('recording');
                recordBtn.textContent = "Recording... Release to send";
                resultsEl.style.display = 'none';
            }
        }
        
        function stopRecording(e) {
            e.preventDefault();
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording');
                recordBtn.textContent = "Hold to Speak";
            }
        }

        async function sendAudioToServer(audioBlob) {
            loadingEl.style.display = 'block';
            
            const formData = new FormData();
            formData.append("audio", audioBlob, "recording.webm");
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                // Display Results
                transcriptionText.textContent = data.transcribed_text || "[Empty/Unintelligible]";
                answerText.textContent = data.answer;
                
                // Color code rejection
                const answerCard = answerText.parentElement;
                if (data.rejected) {
                    answerCard.style.borderLeft = "5px solid #e74c3c";
                    answerText.textContent = `❌ ${data.rejection_reason}\n\n${data.answer}`;
                } else {
                    answerCard.style.borderLeft = "5px solid #2ecc71";
                    if (data.sources && data.sources.length > 0) {
                        answerText.textContent += ` (Sources: ${data.sources.join(', ')})`;
                    }
                }
                
                // Render latencies
                latencyMetrics.innerHTML = '';
                const l = data.latency;
                const metrics = {
                    "STT": l.stt_ms,
                    "Input Guard": l.input_guard_ms,
                    "Embedding": l.embedding_ms,
                    "Retrieval": l.retrieval_ms,
                    "Reranking": l.reranking_ms,
                    "Generation": l.generation_ms,
                    "Total RAG": l.rag_total_ms,
                    "Total E2E": l.e2e_total_ms
                };
                
                for (const [key, val] of Object.entries(metrics)) {
                    if (val !== undefined && val !== null && val > 0) {
                        const div = document.createElement('div');
                        div.className = 'metric-item';
                        div.textContent = `${key}: ${val.toFixed(1)}ms`;
                        latencyMetrics.appendChild(div);
                    }
                }
                
                resultsEl.style.display = 'block';
            } catch (err) {
                console.error(err);
                alert("Failed to reach server.");
            } finally {
                loadingEl.style.display = 'none';
            }
        }
    </script>
</body>
</html>
