[project]
name = "hhgoa_voicerag"
version = "0.0.1"
description = "hhGoa VoiceRAG application"
requires-python = ">=3.10"
dependencies = [
	"fastapi==0.115.0",
	"uvicorn==0.30.0",
	"python-multipart==0.0.9",
	"fastembed==0.3.6",
	"pydantic-settings==2.4.0",
	"python-dotenv==1.0.1",
	"httpx==0.27.0",
]

[project.optional-dependencies]
models = [
	"uvicorn[standard]==0.30.0",
	"qdrant-client==1.11.0",
	"sentence-transformers==3.0.0",
	"groq==0.9.0",
	"tenacity==8.5.0",
	"pydantic==2.8.0",
	"datasets==2.20.0",
	"numpy==1.26.4",
	"nltk==3.8.1",
	"torch==2.3.1",
	"transformers==4.42.0",
	"tokenizers==0.19.1",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"
